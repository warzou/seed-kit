<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wifi-Kit - Seed-Kit</title>
  <style>
    :root {
      --bg: #07111c;
      --bg-2: #0d1927;
      --surface: rgba(14, 24, 36, 0.72);
      --surface-strong: rgba(24, 37, 57, 0.96);
      --surface-soft: rgba(255, 255, 255, 0.055);
      --ink: #f7f9ff;
      --soft: #d8e4f5;
      --muted: #a9b5c8;
      --dim: #74839b;
      --line: rgba(213, 229, 255, 0.12);
      --line-hot: rgba(48, 151, 255, 0.72);
      --blue: #2d95ff;
      --cyan: #44d4e6;
      --violet: #8274ff;
      --green: #53dc62;
      --orange: #ffb13d;
      --red: #ff554d;
      --code: #050b12;
      --shadow: 0 26px 58px rgba(0, 0, 0, 0.48);
      --glow: 0 18px 42px rgba(45, 149, 255, 0.24);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% -6%, rgba(45, 149, 255, 0.24), transparent 16rem),
        radial-gradient(circle at 92% 4%, rgba(68, 212, 230, 0.12), transparent 18rem),
        linear-gradient(180deg, #050b12 0%, var(--bg) 58%, #0b1420 100%);
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", Verdana, sans-serif;
      line-height: 1.42;
    }

    button, input { font: inherit; }

    .shell {
      width: min(680px, calc(100% - 22px));
      margin: 12px auto 22px;
      border: 1px solid rgba(213, 229, 255, 0.11);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(10, 22, 35, 0.74), rgba(5, 12, 20, 0.56)),
        radial-gradient(circle at 12% 0%, rgba(45, 149, 255, 0.12), transparent 18rem);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
      padding: 17px 13px 16px;
    }

    .app {
      display: grid;
      gap: 14px;
      overflow: hidden;
    }

    .hero {
      display: grid;
      gap: 12px;
      padding: 5px 3px 8px;
    }

    .hero-top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand-row {
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0;
    }

    .orb,
    .network-orb,
    .status-icon,
    .safe-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 999px;
      color: #fff;
      font-weight: 950;
      letter-spacing: -0.08em;
    }

    .icon-svg {
      width: 1.32em;
      height: 1.32em;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .orb .icon-svg,
    .network-orb .icon-svg {
      width: 34px;
      height: 34px;
      stroke-width: 2.55;
    }

    .orb {
      width: 66px;
      height: 66px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.34), transparent 30%),
        linear-gradient(145deg, #3eb8ff, #5b63ff 62%, #7a55ff);
      box-shadow: 0 18px 44px rgba(45, 149, 255, 0.36);
      font-size: 1.05rem;
    }

    .crumb {
      margin: 0 0 2px;
      color: #7eb9ff;
      font-size: 0.82rem;
      font-weight: 800;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin: 0;
      font-size: clamp(2.45rem, 14vw, 4rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 4px;
      font-size: 1.03rem;
      letter-spacing: -0.02em;
    }

    h3 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 1.08rem;
      line-height: 1.16;
    }

    .lead {
      margin: 0;
      max-width: 40ch;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .chip,
    .badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 26px;
      border: 1px solid rgba(68, 212, 230, 0.24);
      border-radius: 999px;
      background: rgba(68, 212, 230, 0.08);
      color: #bdefff;
      padding: 4px 10px;
      font-size: 0.73rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .hero .chip {
      min-height: 34px;
      border-color: rgba(68, 212, 230, 0.54);
      background: rgba(6, 24, 38, 0.72);
      color: #6ef1ff;
      box-shadow: inset 0 0 0 1px rgba(68, 212, 230, 0.1);
    }

    .panel,
    details {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(180deg, var(--surface-strong), rgba(11, 20, 32, 0.88)),
        radial-gradient(circle at top left, rgba(45, 149, 255, 0.1), transparent 15rem);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel { padding: 12px; }

    .overview {
      width: 100%;
      display: grid;
      gap: 12px;
      padding: 4px 2px 2px;
    }

    .overview::before {
      content: none;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 12px;
      align-items: stretch;
    }

    .overview-safe {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 0;
    }

    .status-mini,
    .safe-mini,
    .metric {
      min-width: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
    }

    .status-mini {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
      min-height: 42px;
      padding: 0;
    }

    .safe-mini {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.035);
      padding: 5px 9px 5px 6px;
      text-align: left;
    }

    .status-icon,
    .safe-icon {
      width: 34px;
      height: 34px;
      background: transparent;
      color: var(--blue);
      box-shadow: none;
      font-size: 1rem;
    }

    .status-icon .icon-svg {
      width: 31px;
      height: 31px;
      stroke-width: 2.5;
    }

    .status-mini:nth-child(1) .status-icon {
      color: var(--cyan);
    }

    .status-mini:nth-child(2) .status-icon {
      color: #7eb9ff;
    }

    .status-mini:nth-child(3) .status-icon {
      color: var(--violet);
    }

    .status-mini:nth-child(4) .status-icon {
      color: var(--green);
    }

    .safe-icon {
      width: 34px;
      height: 34px;
      box-shadow: none;
    }

    .safe-icon .icon-svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.25;
    }

    .safe-icon.safe { background: rgba(83, 220, 98, 0.12); color: var(--green); }
    .safe-icon.lock { background: rgba(255, 177, 61, 0.12); color: var(--orange); }
    .safe-icon.mute { background: rgba(130, 116, 255, 0.13); color: var(--violet); }
    .safe-icon.gear { background: rgba(68, 212, 230, 0.11); color: var(--cyan); }

    .status-mini span,
    .metric span,
    .safe-mini span {
      display: block;
      color: var(--dim);
      font-size: 0.62rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-mini strong,
    .metric strong,
    .safe-mini strong {
      display: block;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 0.96rem;
    }

    .safe-mini strong { font-size: 0.78rem; }

    .section-head {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-copy,
    .scan-status,
    .empty,
    .prep-summary {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .scan-status { margin-top: 4px; color: #cbd7e8; }

    .button {
      min-height: 44px;
      border: 1px solid rgba(111, 205, 255, 0.42);
      border-radius: 18px;
      background: linear-gradient(135deg, #4f72ff, #38d0c8);
      box-shadow: 0 16px 32px rgba(45, 149, 255, 0.22);
      color: #f8fbff;
      padding: 9px 15px;
      font-weight: 950;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    #refresh {
      min-width: 118px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.2), transparent 34%),
        linear-gradient(135deg, rgba(79, 114, 255, 0.92), rgba(56, 208, 200, 0.9));
    }

    .button .icon-svg {
      display: inline-block;
      width: 1em;
      height: 1em;
      margin-right: 7px;
      vertical-align: -0.16em;
    }

    .button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 40px rgba(45, 149, 255, 0.28);
    }

    .button:disabled {
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
      color: var(--dim);
      cursor: default;
    }

    .network-list {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .network {
      display: grid;
      gap: 11px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      background:
        radial-gradient(circle at 0% 50%, rgba(45, 149, 255, 0.12), transparent 12rem),
        linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(11, 24, 38, 0.7));
      padding: 12px;
      text-align: left;
      transition: border-color 190ms ease, background 190ms ease, transform 190ms ease, box-shadow 190ms ease;
    }

    .network.selectable { cursor: pointer; }

    .network.selectable:hover,
    .network.selected {
      border-color: var(--line-hot);
      background: linear-gradient(180deg, rgba(45, 149, 255, 0.14), rgba(19, 35, 53, 0.78));
      transform: translateY(-1px);
    }

    .network.selected { box-shadow: inset 0 0 0 1px rgba(45, 149, 255, 0.38), var(--glow); }

    .network.selected .network-main {
      border-radius: 18px;
      background: linear-gradient(90deg, rgba(68, 212, 230, 0.1), transparent);
      margin: -3px;
      padding: 3px;
    }

    .network-main {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
    }

    .network-orb {
      width: 62px;
      height: 62px;
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.34), transparent 32%),
        linear-gradient(145deg, var(--blue), #0e65d8);
      box-shadow: 0 18px 34px rgba(45, 149, 255, 0.2);
      font-size: 0.98rem;
    }

    .network-orb.good { background: linear-gradient(145deg, #58cd55, #218a2f); }
    .network-orb.mid { background: linear-gradient(145deg, #ffbc42, #d88613); }
    .network-orb.low { background: linear-gradient(145deg, #2c9af1, #205fba); }
    .network-orb.bad { background: linear-gradient(145deg, #e3443e, #922523); }

    .network-text { min-width: 0; }

    .network-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-top: 8px;
    }

    .badge {
      min-height: 23px;
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      padding: 4px 9px;
      font-size: 0.67rem;
      border-radius: 999px;
    }

    .badge.quality { color: var(--quality-color, var(--blue)); border-color: rgba(255, 255, 255, 0.16); }

    .choice-dot {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.74);
      background: rgba(255, 255, 255, 0.045);
      font-weight: 950;
    }

    .network.selected .choice-dot {
      border-color: var(--cyan);
      background: linear-gradient(180deg, var(--cyan), var(--blue));
      color: #07111c;
    }

    .signal-cluster {
      display: grid;
      gap: 5px;
      justify-items: end;
      min-width: 55px;
    }

    .signal-bars {
      display: inline-flex;
      align-items: end;
      gap: 2px;
      min-height: 20px;
    }

    .signal-bars span {
      display: block;
      width: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
    }

    .signal-bars span:nth-child(1) { height: 8px; }
    .signal-bars span:nth-child(2) { height: 12px; }
    .signal-bars span:nth-child(3) { height: 18px; }
    .signal-bars span:nth-child(4) { height: 24px; }

    .signal-bars[data-level="1"] span:nth-child(-n+1),
    .signal-bars[data-level="2"] span:nth-child(-n+2),
    .signal-bars[data-level="3"] span:nth-child(-n+3),
    .signal-bars[data-level="4"] span:nth-child(-n+4) {
      background: var(--signal-color, var(--blue));
    }

    .signal-quality {
      color: var(--signal-color, var(--blue));
      font-size: 0.78rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .network-prep {
      display: grid;
      gap: 9px;
      border: 1px solid rgba(68, 212, 230, 0.16);
      border-radius: 20px;
      background:
        radial-gradient(circle at top left, rgba(68, 212, 230, 0.12), transparent 12rem),
        rgba(5, 13, 22, 0.38);
      padding: 12px;
    }

    .field-label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 900;
    }

    .field-hint { color: var(--muted); font-weight: 500; }

    .password-local {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(221, 234, 255, 0.15);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      outline: none;
      padding: 11px 13px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .password-local::placeholder { color: rgba(245, 247, 251, 0.42); }

    .password-local:not(:disabled):focus {
      border-color: rgba(68, 212, 230, 0.72);
      box-shadow: 0 0 0 4px rgba(68, 212, 230, 0.12);
    }

    .prepare-plan {
      display: grid;
      gap: 8px;
      border: 1px solid rgba(83, 220, 98, 0.18);
      border-radius: 20px;
      background: rgba(83, 220, 98, 0.06);
      padding: 12px;
    }

    .prepare-plan[hidden] { display: none; }

    .safe-lines {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .safe-lines li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      color: var(--soft);
      font-size: 0.84rem;
    }

    .check { color: var(--green); font-weight: 950; }

    .callout {
      margin-top: 10px;
      border: 1px solid rgba(242, 200, 121, 0.28);
      border-radius: 17px;
      background: rgba(242, 200, 121, 0.09);
      padding: 11px;
      color: #ffe3a6;
      font-size: 0.9rem;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    details {
      box-shadow: none;
      opacity: 0.74;
      padding: 12px;
    }

    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 750;
    }

    .advanced-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    details h2 {
      margin-bottom: 6px;
      color: var(--soft);
      font-size: 0.82rem;
      font-weight: 750;
    }

    pre {
      width: 100%;
      margin: 7px 0 0;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: var(--code);
      color: #cde8d1;
      overflow: auto;
      font-size: 0.68rem;
      line-height: 1.35;
      max-height: 220px;
    }

    .bottom-nav {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(9, 18, 30, 0.66);
      padding: 8px;
    }

    .nav-item {
      display: grid;
      gap: 5px;
      justify-items: center;
      border: 0;
      border-radius: 17px;
      background: transparent;
      color: var(--dim);
      padding: 9px 5px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .nav-item .icon-svg {
      width: 23px;
      height: 23px;
    }

    .nav-item.active {
      background: rgba(68, 212, 230, 0.09);
      color: var(--cyan);
    }

    @media (min-width: 760px) {
      .shell { padding: 20px 18px 18px; }
      .overview-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .network-orb {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>

    </symbol>
  </svg>
  <main class="shell app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand-row">
          <span class="orb" aria-hidden="true"><svg class="icon-svg"><use href="#icon-wifi"></use></svg></span>
          <div>
            <p class="crumb">Seed-Kit &gt; Wifi-Kit</p>
            <h1>Wifi-Kit</h1>
          </div>
        </div>
        <span class="chip">Read-only</span>
      </div>
      <p class="lead">Pr&eacute;pare une connexion Wi-Fi sans modifier le Raspberry Pi.</p>
    </header>

    <section class="overview" aria-label="Etat du node en lecture seule">
      <div class="overview-grid" aria-label="Etat actuel du node">
        <div class="status-mini"><span class="status-icon"><svg class="icon-svg"><use href="#icon-network"></use></svg></span><div><span>Interface</span><strong id="status-interface">...</strong></div></div>
        <div class="status-mini"><span class="status-icon"><svg class="icon-svg"><use href="#icon-location"></use></svg></span><div><span>Adresse IP</span><strong id="status-ip">...</strong></div></div>
        <div class="status-mini"><span class="status-icon"><svg class="icon-svg"><use href="#icon-server"></use></svg></span><div><span>Backend</span><strong id="status-backend">...</strong></div></div>
        <div class="status-mini"><span class="status-icon"><svg class="icon-svg"><use href="#icon-wifi"></use></svg></span><div><span>Reseau actuel</span><strong id="status-ssid">...</strong></div></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="network-title">
      <div class="section-head">
        <div>
          <h2 id="network-title">Reseaux disponibles</h2>
          <p class="section-copy" id="scan-source">Source de scan: inconnue</p>
          <p id="scan-status" class="scan-status">Scan passif pret.</p>
        </div>
        <button id="refresh" type="button" class="button"><svg class="icon-svg" aria-hidden="true"><use href="#icon-refresh"></use></svg>Actualiser</button>
      </div>
      <div id="scan-message" class="callout" hidden></div>
      <div id="network-list" class="network-list"></div>
    </section>

    <details class="advanced">
      <summary>Diagnostics avances</summary>
      <div class="advanced-grid">
        <section aria-labelledby="node-title">
          <h2 id="node-title">Diagnostic SAFE</h2>
          <div id="node-state" class="mini-grid"></div>
        </section>
        <section aria-labelledby="json-title">
          <h2 id="json-title">JSON brut</h2>
          <pre id="raw-diagnose"></pre>
          <pre id="raw-scan"></pre>
          <pre id="raw-snapshot"></pre>
        </section>
      </div>
    </details>

    <nav class="bottom-nav" aria-label="Navigation visuelle">
      <button class="nav-item active" type="button" aria-current="page"><svg class="icon-svg" aria-hidden="true"><use href="#icon-wifi"></use></svg>Reseaux</button>
      <button class="nav-item" type="button"><svg class="icon-svg" aria-hidden="true"><use href="#icon-server"></use></svg>Apercu</button>
      <button class="nav-item" type="button"><svg class="icon-svg" aria-hidden="true"><use href="#icon-activity"></use></svg>Diag</button>
      <button class="nav-item" type="button"><svg class="icon-svg" aria-hidden="true"><use href="#icon-info"></use></svg>Infos</button>
    </nav>
  </main>

  <script id="wifi-kit-data" type="application/json">
{
  "diagnose": {
    "mode": "safe-diagnose",
    "timestamp": "demo",
    "dry_run_only": true,
    "real_apply_allowed": false,
    "backend": "unknown",
    "interface": "unknown",
    "current_ssid_state": "unknown",
    "current_ip": "unknown",
    "default_route": "unknown",
    "power_save": "unknown",
    "ssh_client": "unknown",
    "ssh_route_interface": "unknown",
    "scan_status": "unknown",
    "connect_safe": "simulation-only",
    "secret_policy": "no-secrets",
    "network_writes": false,
    "services_started": false
  },
  "snapshot": {
    "mode": "simulate",
    "backend": "unknown",
    "interface": "unknown",
    "current_ssid_state": "unknown",
    "current_ip": "unknown",
    "default_route": "unknown",
    "power_save": "unknown",
    "ssh_client": "unknown",
    "ssh_route_interface": "unknown",
    "runtime_fingerprint": "unknown",
    "timestamp": "demo",
    "secret_policy": "no-secrets",
    "persistence": "none"
  },
  "scan": {
    "backend": "wpa_cli",
    "interface": "unknown",
    "timestamp": "demo",
    "status": "unavailable",
    "reason": "demo-data",
    "networks": []
  }
}
  </script>
  <script>
    let data = JSON.parse(document.getElementById('wifi-kit-data').textContent);
    let selectedNetwork = null;

    function value(source, key) {
      return String(source?.[key] ?? 'inconnu');
    }

    function metric(label, text) {
      const item = document.createElement('div');
      item.className = 'metric';
      const small = document.createElement('span');
      const strong = document.createElement('strong');
      small.textContent = label;
      strong.textContent = text;
      item.append(small, strong);
      return item;
    }

    function yesNo(flag) {
      return flag ? 'activee' : 'desactivee';
    }

    function describeConnection() {
      const ip = value(data.diagnose, 'current_ip');
      const iface = value(data.diagnose, 'interface');
      const ssid = value(data.diagnose, 'current_ssid_state');
      const backend = data.scan?.backend || value(data.diagnose, 'backend');
      document.getElementById('status-interface').textContent = iface;
      document.getElementById('status-ip').textContent = ip;
      document.getElementById('status-backend').textContent = backend || 'inconnu';
      document.getElementById('status-ssid').textContent = ssid;
    }

    function describeScanBackend(scan) {
      const backend = scan.backend || 'unknown';
      if (backend === 'wpa_cli') return 'wpa_cli scan_results - lecture seule';
      if (backend === 'iw') return 'iw scan - fallback lecture seule';
      return `Source de scan: ${backend}`;
    }

    function describeScanStatus(scan) {
      const networks = Array.isArray(scan.networks) ? scan.networks.length : 0;
      const suffix = networks > 1 ? 'reseaux trouves' : 'reseau trouve';
      if (scan.refresh_attempted) {
        const status = scan.refresh_status || 'unknown';
        if (status === 'ok') return `${networks} ${suffix} apres actualisation`;
        if (status === 'failed-used-existing-results') return `${networks} ${suffix}; cache conserve`;
        return `${networks} ${suffix}; scan ${status}`;
      }
      return `${networks} ${suffix} en lecture passive`;
    }

    function signalDbm(signal) {
      const match = String(signal || '').match(/-?\d+/);
      return match ? Number(match[0]) : null;
    }

    function signalQuality(signal) {
      const dbm = signalDbm(signal);
      if (dbm === null) return { label: 'Inconnu', level: 0, dbm: 'dBm inconnu', tone: 'low', color: 'var(--blue)' };
      if (dbm >= -50) return { label: 'Excellent', level: 4, dbm: `${dbm} dBm`, tone: 'good', color: 'var(--green)' };
      if (dbm >= -60) return { label: 'Tres bon', level: 4, dbm: `${dbm} dBm`, tone: 'good', color: 'var(--green)' };
      if (dbm >= -67) return { label: 'Bon', level: 3, dbm: `${dbm} dBm`, tone: 'low', color: 'var(--blue)' };
      if (dbm >= -75) return { label: 'Moyen', level: 2, dbm: `${dbm} dBm`, tone: 'mid', color: 'var(--orange)' };
      return { label: 'Faible', level: 1, dbm: `${dbm} dBm`, tone: 'bad', color: 'var(--red)' };
    }

    function signalBars(quality) {
      const bars = document.createElement('div');
      bars.className = 'signal-bars';
      bars.dataset.level = String(quality.level);
      bars.style.setProperty('--signal-color', quality.color);
      bars.setAttribute('aria-label', `Signal ${quality.label}`);
      for (let i = 0; i < 4; i += 1) bars.appendChild(document.createElement('span'));
      return bars;
    }

    function makeIcon(name) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      svg.classList.add('icon-svg');
      svg.setAttribute('aria-hidden', 'true');
      use.setAttribute('href', `#icon-${name}`);
      svg.appendChild(use);
      return svg;
    }

    function describeScanReason(scan) {
      const reason = scan.reason || scan.status || 'unknown';
      if (reason === 'scan-readonly-failed') return 'Le Raspberry Pi ne peut pas lire les resultats Wi-Fi pour le moment. La connexion actuelle reste preservee.';
      if (reason === 'scan-tools-missing') return "Le scan Wi-Fi n'est pas disponible car wpa_cli et iw sont absents ou introuvables.";
      if (reason === 'iw-scan-failed') return 'Le fallback iw ne peut pas scanner les reseaux pour le moment tout en gardant la connexion Wi-Fi actuelle.';
      if (reason === 'iw-missing') return "Le scan Wi-Fi n'est pas disponible car l'outil iw est absent.";
      if (reason === 'no-wifi-interface') return "Aucune interface Wi-Fi n'a ete detectee.";
      if (reason === 'demo-data') return 'Aucun reseau reel dans la demo. Lance le serveur local read-only pour afficher les donnees du Raspberry Pi.';
      return `Le scan Wi-Fi est indisponible pour le moment (${reason}).`;
    }

    function displaySsid(network) {
      return network?.ssid_hidden ? 'Reseau masque' : (network?.ssid || 'Reseau masque');
    }

    function selectNetwork(network) {
      selectedNetwork = network;
      renderNetworks();
    }

    function buildPrepPanel(network) {
      const prep = document.createElement('div');
      prep.className = 'network-prep';

      const passwordLabel = document.createElement('label');
      passwordLabel.className = 'field-label';
      passwordLabel.innerHTML = 'Preparation SAFE <span class="field-hint">Mot de passe local uniquement, jamais envoye.</span>';
      const password = document.createElement('input');
      password.className = 'password-local';
      password.type = 'password';
      password.autocomplete = 'new-password';
      password.placeholder = 'Mot de passe';
      passwordLabel.appendChild(password);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'button';
      button.textContent = 'Preparer en simulation';

      const summary = document.createElement('p');
      summary.className = 'prep-summary';
      summary.textContent = 'Aucune connexion reelle. Ce plan reste dans le navigateur.';

      const plan = document.createElement('div');
      plan.className = 'prepare-plan';
      plan.hidden = true;

      button.addEventListener('click', (event) => {
        event.stopPropagation();
        renderInlinePlan(network, plan);
      });
      password.addEventListener('click', (event) => event.stopPropagation());
      password.addEventListener('keydown', (event) => event.stopPropagation());

      prep.append(passwordLabel, button, summary, plan);
      return prep;
    }

    function renderInlinePlan(network, plan) {
      plan.replaceChildren();
      const title = document.createElement('strong');
      title.textContent = 'Plan simule';
      const list = document.createElement('ul');
      list.className = 'safe-lines';
      [
        ['shield', 'safe', 'Votre systeme reste intact'],
        ['lock', 'lock', 'Aucun secret transmis'],
        ['wifi', 'mute', `Reseau cible prepare: ${displaySsid(network)}`],
        ['gear', 'gear', 'Rollback et validation SSH avant tout vrai essai']
      ].forEach(([icon, tone, text]) => {
        const li = document.createElement('li');
        const badge = document.createElement('span');
        const check = document.createElement('span');
        badge.className = `safe-icon ${tone}`;
        badge.appendChild(makeIcon(icon));
        check.className = 'check';
        check.textContent = 'OK';
        li.append(badge, document.createTextNode(text), check);
        list.appendChild(li);
      });
      plan.append(title, list);
      plan.hidden = false;
    }

    function renderNodeState() {
      const target = document.getElementById('node-state');
      target.replaceChildren(
        metric('Interface', value(data.diagnose, 'interface')),
        metric('Adresse IP', value(data.diagnose, 'current_ip')),
        metric('Route', value(data.diagnose, 'default_route')),
        metric('Economie energie', value(data.diagnose, 'power_save')),
        metric('Backend', value(data.diagnose, 'backend')),
        metric('Chemin SSH', value(data.diagnose, 'ssh_route_interface'))
      );
    }

    function renderNetworks() {
      const target = document.getElementById('network-list');
      const message = document.getElementById('scan-message');
      const scan = data.scan || {};
      const networks = Array.isArray(scan.networks) ? scan.networks : [];
      document.getElementById('scan-source').textContent = describeScanBackend(scan);
      document.getElementById('scan-status').textContent = describeScanStatus(scan);
      target.innerHTML = '';

      if (networks.length === 0) {
        message.hidden = false;
        message.textContent = describeScanReason(scan);
        const placeholder = document.createElement('div');
        placeholder.className = 'network';
        const title = document.createElement('h3');
        const body = document.createElement('p');
        title.textContent = 'Aucun reseau affiche';
        body.className = 'empty';
        body.textContent = 'La connexion actuelle reste preservee. Scanne plus tard ou ouvre les diagnostics.';
        placeholder.append(title, body);
        target.append(placeholder);
        return;
      }

      message.hidden = true;
      networks.forEach((network) => {
        const row = document.createElement('div');
        row.className = 'network selectable';
        row.setAttribute('aria-expanded', selectedNetwork === network ? 'true' : 'false');

        const quality = signalQuality(network.signal);
        const main = document.createElement('div');
        const orb = document.createElement('span');
        const text = document.createElement('div');
        const title = document.createElement('h3');
        const meta = document.createElement('div');
        const signal = document.createElement('div');
        const signalLabel = document.createElement('div');
        const dot = document.createElement('span');
        const ssid = displaySsid(network);

        main.className = 'network-main';
        orb.className = `network-orb ${quality.tone}`;
        orb.appendChild(makeIcon('wifi'));
        text.className = 'network-text';
        title.textContent = ssid;
        meta.className = 'network-sub';
        signal.className = 'signal-cluster';
        signalLabel.className = 'signal-quality';
        signalLabel.textContent = quality.dbm;
        signalLabel.style.setProperty('--signal-color', quality.color);
        dot.className = 'choice-dot';
        dot.appendChild(makeIcon('chevron'));

        [
          [network.security || 'securite inconnue', ''],
          [`Canal ${network.channel || 'inconnu'}`, ''],
          [quality.label, 'quality']
        ].forEach(([label, className]) => {
          const badge = document.createElement('span');
          badge.className = `badge ${className}`.trim();
          badge.textContent = label;
          if (className) badge.style.setProperty('--quality-color', quality.color);
          meta.appendChild(badge);
        });

        text.append(title, meta);
        signal.append(signalBars(quality), signalLabel);
        main.append(orb, text, signal, dot);
        row.append(main);

        if (selectedNetwork === network) {
          row.classList.add('selected');
          row.appendChild(buildPrepPanel(network));
        }

        row.addEventListener('click', () => selectNetwork(network));
        target.append(row);
      });
    }

    function renderSafety() {
      const realApply = document.getElementById('real-apply');
      const secretPolicy = document.getElementById('secret-policy');
      if (realApply) realApply.textContent = yesNo(data.diagnose?.real_apply_allowed);
      if (secretPolicy) {
        secretPolicy.textContent = value(data.diagnose, 'secret_policy') === 'no-secrets'
          ? 'non collectes'
          : value(data.diagnose, 'secret_policy');
      }
    }

    function renderDebug() {
      document.getElementById('raw-diagnose').textContent = JSON.stringify(data.diagnose, null, 2);
      document.getElementById('raw-scan').textContent = JSON.stringify(data.scan, null, 2);
      document.getElementById('raw-snapshot').textContent = JSON.stringify(data.snapshot, null, 2);
    }

    function renderAll() {
      describeConnection();
      renderNodeState();
      renderNetworks();
      renderSafety();
      renderDebug();
    }

    async function refreshScanFromServer() {
      if (window.location.protocol === 'file:') return;

      const button = document.getElementById('refresh');
      const status = document.getElementById('scan-status');
      button.disabled = true;
      status.textContent = 'Scan SAFE en cours...';
      try {
        const response = await fetch('/api/scan?refresh=1', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        selectedNetwork = null;
        data.scan = await response.json();
        renderAll();
      } catch (error) {
        status.textContent = `Scan impossible: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('refresh').addEventListener('click', refreshScanFromServer);
    renderAll();
  </script>
